name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --registry=https://registry.npmjs.org
      - name: Verify single-file output
        run: node -e "const fs = require('node:fs'); const files = fs.readdirSync('dist'); if (files.length !== 1 || files[0] !== 'index.html') throw new Error('Expected only dist/index.html');"

  test:
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install ruff==0.14.14
      - run: python -m ruff check scripts tests
      - name: Generate Python example
        shell: python
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path

          subprocess.run([
              sys.executable, '-m', 'scripts.cli', 'examples/cat/pixel.png',
              str(Path(os.environ['RUNNER_TEMP']) / 'cat-pattern'),
              '--boards', '36,52', '--default-size', '52', '--max-colors', '16',
          ], check=True)
      - name: Verify generated artifact
        shell: python
        run: |
          import csv
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['RUNNER_TEMP']) / 'cat-pattern'
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['default_size'] == 52
          for board in manifest['files']['boards']:
              with (root / board['usage']).open(encoding='utf-8-sig', newline='') as file:
                  total = sum(int(row['count']) for row in csv.DictReader(file))
              assert total == board['bead_count']
          assert (root / 'output/pattern.html').is_file()
