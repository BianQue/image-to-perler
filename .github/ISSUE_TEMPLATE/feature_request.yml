name: 功能建议
description: 描述一个具体的使用问题或改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 哪项实际工作目前无法完成或比较麻烦？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的行为
      description: 请描述输入、输出和用户可观察的变化。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你目前如何处理这个问题？
